openapi: 3.0.3
info:
  title: infra-print · 打印渲染
  version: 2.0.0
  description: |
    对外 REST 面，路径统一挂在 `/infra/print/**` 前缀下。

    本组件是纯函数：同样的模板版本 + 同样的数据 = 同样的输出。`POST /render`
    没有幂等键，重复调用直接重算一遍，调用方超时可以直接重发。

paths:
  /infra/print/render:
    post:
      summary: 渲染——前端直接要预览/打印时用
      operationId: render
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenderRequest" }
      responses:
        "200":
          description: 渲染成功，响应体是原始字节流（PDF 或 ZPL 文本）
          content:
            application/pdf: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string } }

  /infra/print/templates:
    get:
      summary: 模板清单
      operationId: listTemplates
      parameters:
        - { name: channel,    in: query, schema: { type: string, enum: [PDF, ZPL] } }
        - { name: cursor,     in: query, schema: { type: string } }
        - { name: page_size,  in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateListResponse" }

  /infra/print/templates/{id}:
    get:
      summary: 模板详情
      operationId: getTemplate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrintTemplate" }
    put:
      summary: 上传新版本
      operationId: putTemplate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrintTemplate" }

  /infra/print/templates/{id}/rollback:
    post:
      summary: 回滚到指定历史版本——把历史版本复制成新的当前版本，不是删掉新版本
      operationId: rollbackTemplate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrintTemplate" }

  /infra/print/templates/{id}/versions:
    get:
      summary: 模板的历史版本，新的在前（游标分页）。回滚时用它选版本
      operationId: listTemplateVersions
      parameters:
        - { name: id,        in: path,  required: true, schema: { type: string } }
        - { name: cursor,    in: query, schema: { type: string }, description: "上一页的 next_cursor；空 = 从最新版本开始" }
        - { name: page_size, in: query, schema: { type: integer }, description: "1–200，缺省或越界按 50" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateVersionListResponse" }
        "400":
          description: cursor 不是上一页给出的值
        "404":
          description: 模板不存在

  /infra/print/templates/{id}/preview:
    post:
      summary: 用样例数据预览，不写 print_jobs（不算一次正式渲染）
      operationId: previewTemplate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { type: object, description: "样例数据" }
      responses:
        "200":
          description: 预览成功，响应体是原始字节流
          content:
            application/pdf: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string } }

components:
  schemas:
    RenderRequest:
      type: object
      required: [template_id, data]
      properties:
        template_id: { type: string }
        data: { type: object, description: "渲染所需的全部数据，本组件不回查任何业务库" }

    PrintTemplate:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        channel: { type: string, enum: [PDF, ZPL] }
        content: { type: string }
        version: { type: integer }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TemplateUpdate:
      type: object
      required: [name, channel, content]
      properties:
        name: { type: string }
        channel: { type: string, enum: [PDF, ZPL] }
        content: { type: string }
        enabled: { type: boolean }

    TemplateVersion:
      type: object
      properties:
        version: { type: integer }
        name: { type: string }
        enabled: { type: boolean, description: "写入这个版本时模板的启用状态" }
        created_at: { type: string, format: date-time }

    TemplateVersionListResponse:
      type: object
      properties:
        versions:
          type: array
          items: { $ref: "#/components/schemas/TemplateVersion" }
        next_cursor: { type: string, description: "空 = 没有更早的版本了" }

    TemplateListResponse:
      type: object
      properties:
        templates:
          type: array
          items: { $ref: "#/components/schemas/PrintTemplate" }
        next_cursor: { type: string }
