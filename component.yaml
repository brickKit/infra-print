apiVersion: brickkit/v1
kind: Component

metadata:
  id: infra/print                     # ⚠️ Fork 件必须与标准件完全一致（§3.4.1）
  name: 打印渲染中心
  version: 1.0.6                      # 精确版本，不接受 ^ / ~ / latest。1.0.4：新增 make seed（从零设计——建仓库以来没有任何模板数据，Render 之前拿任何 template_id 都是 404，组件完全没法被真机体验）。上传 2 个真实模板：seed-template-delivery-note（PDF，WeasyPrint+Jinja2，真实按行循环，显式写 font-family: "Noto Sans CJK SC" 避开 fontconfig 默认选错 JP 变体这个 README.md 已记载的已知坑）+ seed-template-shipping-label（ZPL，含真实条码指令）。真机验证过真调 Render：PDF 真实渲染成功、pdftotext 提取中文无乱码；ZPL 正确变量替换。没有配套 seed-clean——模板走版本管理，重跑只追加新版本。无破坏性变更；1.0.3：docs/手册.md 的 TEST_PG_DSN/DATABASE_NAME 示例改指向 brickkit_test_db，纯文档，无行为/契约变更
                                      # v1.0.6：同 mdm/customer 这次改动，删掉 deployment.labels 的 prometheus.io/port，理由同上。无业务行为/契约变更。
                                      # v1.0.5：阶段四 Task 7，be-shell-python 把本组件直接装成 pip 依赖时，git URL 依赖解析不接受两个不同 tag 的 besdk 同时出现（be-shell-python 已经在用 v0.3.3）。升级本组件的 besdk 依赖到 v0.3.3——核对过 v0.3.1..v0.3.3 只新增 besdk/shell.py 一个外壳级构件模块，本组件用到的既有 API 一字未动，纯升版本号，27 个既有测试全部保持绿。无业务行为/契约变更。
  description: 全系统第一个 Python 组件——纯函数渲染中心，template_id + 数据(JSON) → PDF 字节流或 ZPL 指令流，严禁包含业务逻辑（设计书 §6.11）
  license: Apache-2.0
  vendor: brickKit

tags: [infra, print, python, render]

artifacts:
  - type: api-contract
    format: protobuf
    files:
      - contracts/infra/print/v1/print.proto
      - contracts/events/print.events.json
  - type: api-contract
    format: openapi
    files: [contracts/print.openapi.yaml]
  - type: metadata                    # ← assembly.yaml 靠这一条随组件分发（§3.5）
    files: [assembly.yaml]

# ⚠️ 零强依赖零弱依赖——本组件是"纯函数"（设计计划 §1.1）：数据由调用方
# 整个传进来，本组件不回查任何业务库；不消费任何事件（§6.11 明令禁止
# 理解业务语义）。零出边，只有入边（erp-sales 等业务组件强依赖我）。
dependencies:
  components: []
  resources:
    - { kind: database, engine: postgresql }
    - { kind: mq,       engine: nats }         # 仅用于发 infra.print.rendered.v1 旁路审计事件

configSchema:
  type: object
  properties:
    pgSchema:                         # ⚠️ 不能叫 databaseSchema，DATABASE_ 是保留前缀
      type: string
      default: infra_print
    otelBaseUrl:                      # ⚠️ 不能叫 otelEndpoint，*_ENDPOINT 是保留后缀
      type: string
      default: ""                     # 空 → Blackhole Exporter，零成本（§7.5）
    iamJwksUrl:                       # JWT 本地验签的公钥来源，指向 infra-iam-casdoor
      type: string
      default: ""
    authzBundleUrl:                   # 权限判定的 bundle 轮询地址，指向 infra-authz
      type: string
      default: ""

deployment:
  type: container
  image: brickenterprise/infra-print:1.0.6
  port: 8400                          # 端口册 registry/ports.tsv
  extraPorts:
    - { name: grpc, port: 9400 }      # → INFRA_PRINT_GRPC_ENDPOINT（值仍以 http:// 开头）
  labels:                             # 平台只搬运，不解释键值。值必须是字符串
    prometheus.io/scrape: "true"
    # prometheus.io/port 原来写在这里——阶段四附加 Task 0.1 真机验证
    # servedBy 时发现这个标签会跟同外壳其它成员的 prometheus.io/port 撞车
    # 报错（每个组件的值天然不同，servedBy 的 labels 合并规则没有像 env
    # 变量合并那样排除这类"语义上必然因组件而异"的标签，已反馈给 brickKit，
    # 见装配仓库 docs/dev/brickKit反馈-servedBy的labels合并漏了排除规则.md）。
    # 在 brickKit 修复或给出结论之前，暂时从这里删掉，只在合并后的外壳
    # 自己的条目上保留一份——跟"合并后指标只能走一个共享抓取端口"这个
    # 事实本来就一致，不是单纯绕过。
    prometheus.io/path: "/metrics"
  resources:
    requests: { cpu: "150m", memory: "256Mi" }  # WeasyPrint 渲染比纯 IO 型组件吃内存，起点比默认高一档

migration:
  command: ["python", "-m", "app.migrate", "apply"]

healthCheck:
  type: http
  path: /healthz                      # ⚠️ 只查本进程存活，严禁查库、查依赖组件（§12.3.6）
  startPeriodSeconds: 120              # ⚠️ Python 组件写 120，不是 Go 的默认 60（总纲全局约束§K3、设计书 §12.3.5）
