apiVersion: brickkit/v1
kind: Component

metadata:
  id: infra/print
  name: Print rendering
  version: 2.0.0
  description: A pure rendering service; a template ID plus JSON data becomes a PDF byte stream or a ZPL command stream, with no business logic.
  repository: https://github.com/brickKit/infra-print
  license: Apache-2.0
  vendor: brickKit

tags: [infra, print, python, render]

artifacts:
  - type: api-contract
    format: protobuf
    files: [contracts/infra/print/v1/print.proto, contracts/events/print.events.json]
  - type: api-contract
    format: openapi
    files: [contracts/print.openapi.yaml]
  - type: metadata
    files: [assembly.yaml]

dependencies:
  components: []

configSchema:
  type: object
  properties:
    PG_HOST: {type: string}
    PG_PORT: {type: string, default: "5432"}
    PG_DATABASE: {type: string}
    PG_USER: {type: string}
    PG_PASSWORD: {type: string, secret: true}
    PG_SCHEMA: {type: string, default: infra_print}
    NATS_URL: {type: string}
    OTEL_BASE_URL: {type: string, default: ""}
    AUTHZ_BUNDLE_URL: {type: string}
    IAM_JWKS_URL: {type: string}
  required: [PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD, NATS_URL, AUTHZ_BUNDLE_URL, IAM_JWKS_URL]

deployment:
  type: container
  build: {context: ., dockerfile: Dockerfile}
  port: 8400
  extraPorts:
    - {name: grpc, port: 9400}
  labels:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
  resources:
    requests: {cpu: 150m, memory: 256Mi}

migration:
  command: [python, "-m", infra_print.migrate, apply]

healthCheck:
  type: http
  path: /healthz
  startPeriodSeconds: 120

local:
  language: python
  runCommand: [python, "-m", infra_print.main]
