[project]
name = "infra-print"
version = "2.0.0"
description = "infra/print: a pure rendering service (template ID + JSON data -> PDF or ZPL)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    # 与外壳 be/py-render 钉同一个 tag：pip 不接受同一个 git 依赖出现两个 tag
    "besdk @ git+https://github.com/brickKit/be-sdk-python.git@v0.4.4",
    "weasyprint==63.1",
    "yoyo-migrations==9.0.0",
    "psycopg2-binary==2.9.10",  # yoyo 的 postgresql:// 后端驱动，只给 infra_print/migrate.py 用；业务代码走 asyncpg
    "jinja2==3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.2.0",
    "grpcio-tools==1.76.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 两个根：backend 下是业务包 infra_print；gen 下是 grpc_tools 生成的契约包
# infra.print.v1。生成代码写的是 `from infra.print.v1 import print_pb2`
# （顶层 infra），所以 gen 目录本身不能是一层包。infra 没有 __init__.py，
# 是命名空间包：同一个外壳里再装一个 infra 域的 Python 成员时，两边的
# infra/ 合并而不是互相覆盖；顶层业务包也因此叫 infra_print 而不是 app。
where = ["backend", "gen"]
include = ["infra_print*", "infra*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
